<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile Card - Responsive</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --blue: #2984f4;
        --card-radius: 2em;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7fb;
        padding: 1rem;
      }

      .profile-card {
        width: min(92vw, 345px);
        background: #fff;
        border-radius: var(--card-radius);
        padding: clamp(1.2rem, 4vw, 3.2rem);
        position: relative;
        overflow: hidden;
      }
      .profile-card:hover{
       box-shadow: 0 5px 10px rgba(6, 6, 6, 0.18);
      }

      /* blue header background */
      .profile-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 38%;
        background: var(--blue);
        border-top-left-radius: var(--card-radius);
        border-top-right-radius: var(--card-radius);
        z-index: 0;
      }

      /* ensure all actual content sits above the pseudo background */
      .profile-card > * {
        position: relative;
        z-index: 1;
      }

      .image {
        width: clamp(90px, 26vw, 150px); /* fluid image size */
        height: clamp(90px, 26vw, 150px);
        margin: 0 auto 0.8em;
        padding: 3px; /* outer ring */
        border-radius: 50%;
        background: linear-gradient(180deg, #2d71cf, #1f5fc0);
      }

      .profile-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        display: block;
      }

      .text-data {
        text-align: center;
        color: #222;
        margin-top: 0.6rem;
      }
      .title {
        display: block;
        font-size: clamp(1rem, 3.5vw, 1.4rem);
        font-weight: 600;
      }
      .job {
        display: block;
        font-size: clamp(0.85rem, 2.7vw, 1.05rem);
        color: #444;
        margin-top: 0.2rem;
      }

      .media-button {
        display: flex;
        justify-content: center;
        gap: 0.6rem;
        margin-top: 1.15rem;
      }

      .link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.2rem;
        height: 2.2rem;
        border-radius: 50%;
        color: #fff;
        text-decoration: none;
        font-size: 1.1rem;
      }
      .link--facebook {
        background: #4267b2;
      }
      .link--facebook:hover{
        background-color: #335290;
      }
      .link--github {
        background: #111;
      }
      .link--github:hover{
        background-color: #060505;
      }
      .link--linkedin {
        background: #0077b5;
      }
      .link--linkedin:hover{
        background-color: #015c8d;
      }
      .link--youtube {
        background: #ff0000;
      }

      .link--youtube:hover{
        background-color:  #d10303;
      }

      .link:active{
        opacity:0.5s;
      }

      .buttons {
        display: flex;
        gap: 0.8rem;
        justify-content: center;
        margin: 1.4rem 0;
        flex-wrap: wrap;
      }
      .button {
        background: var(--blue);
        color: white;
        border:2px solid var(--blue);
        border-radius: 24px;
        padding: 0.5rem 1.1rem;
        cursor: pointer;
        font-weight: 500;
      }
      .button:hover{
        background-color:white;
        color:black;
      }
      .button:active{
        opacity:0.5;
      }
      .analytics {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 0.6rem;
        color: #333;
      }
      .data {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding-right: 0.6rem;
        border-right: 1px solid #767575;
        font-size: 0.95rem;
      }
      .data:last-child {
        border-right: none;
      }

      /* small-screen tweaks */
      @media (max-width: 420px) {
        .buttons {
          gap: 0.6rem;
        }
        .media-button {
          gap: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div
      class="profile-card"
      role="region"
      aria-label="Profile card for Sha Muskaan"
    >
      <div class="image">
        <img
          src="profile.jpg"
          alt="Portrait of Sha Muskaan"
          class="profile-image"
        />
      </div>

      <div class="text-data">
        <span class="title">Sha Muskaan</span>
        <span class="job">Frontend Developer</span>
      </div>

      <div class="media-button" aria-hidden="false">
        <a
          class="link link--facebook"
          href="https://www.facebook.com/"
          aria-label="Facebook"
          ><i class="bx bxl-facebook"></i
        ></a>
        <a
          class="link link--github"
          href="https://github.com/shamuskaaan-design"
          aria-label="GitHub"
          ><i class="bx bxl-github"></i
        ></a>
        <a
          class="link link--linkedin"
          href="https://www.linkedin.com/in/sha-muskaan-055110372"
          aria-label="LinkedIn"
          ><i class="bx bxl-linkedin"></i
        ></a>
        <a class="link link--youtube" href="#" aria-label="YouTube"
          ><i class="bx bxl-youtube"></i
        ></a>
      </div>

      <div class="buttons">
        <button class="button" type="button">Subscribe</button>
        <button class="button" type="button">Message</button>
      </div>

      <div class="analytics" role="list">
        <div class="data" role="listitem">
          <i class="bx bx-user"></i><span>20k</span>
        </div>
        <div class="data" role="listitem">
          <i class="bx bx-message-rounded"></i><span>60k</span>
        </div>
        <div class="data" role="listitem">
          <i class="bx bx-badge"></i><span>40k</span>
        </div>
      </div>
    </div>
  </body>
</html>
