<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoginForm</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        padding: 0;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #cc2b5e, #753a88);
        font-family: Arial, Helvetica, sans-serif;
      }

      .box {
        padding: 2em;
        width: 100%;
        max-width: 500px;
        background-color: aliceblue;
        border-radius: 1em;
        box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        transition: transform 0.5s ease, box-shadow 0.5s ease;
      }

      .box:hover {
        transform: scale(1.05); /* makes it bigger */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      }

      h2 {
        margin-bottom: 1em;
        border-bottom: 1px solid black;
        text-align: center;
        padding-bottom: 0.6em;
        color: #cc2b5e;
        font-size: 1.8em;
      }
      .box input {
        margin: 0.4em;
      }
      .box input[type="name"],
      .box input[type="email"],
      .box input[type="number"] {
        width: 100%;
        padding: 0.6em;
      }

      .box label {
        font-size: 1em;
      }
      .requirement {
        display: flex;
        justify-content: space-between;
        margin-top: 1em;
      }

      .requirement a {
        font-size: 1em;
      }

      .box input[type="submit"] {
        width: 100%;
        padding: 0.8em;
        margin-top: 1em;
        background: linear-gradient(to right, #cc2b5e, #753a88);
        border: none;
        border-radius: 0.2em;
        font-size: 1em;
        color: white;
        cursor: grab;
        transition: opacity 0.15s;
      }

      .box input[type="submit"]:hover {
        opacity: 0.8;
      }

      .box input[type="submit"]:hover {
        opacity: 0.8;
      }

      .signup {
        margin-top: 1em;
        text-align: center;
      }

      .box a {
        text-decoration: none;
        color: #753a88;
      }
      select {
        width: 50%;
        padding: 0.8em;
        margin-top: 1em;
      }
      @media only screen and (max-width: 480px) {
        body {
          padding: 2em;
        }
        .box {
          max-width: 450px;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Login Form</h2>
      <form>
        <label for="name">Name:</label>
        <input type="name" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="number">Phone:</label>
        <input type="number" id="number" name="number" />

        <label for="area">Area:</label>
        <select name="Area">
          <option>Bhavani nagar</option>
          <option>Siddiq nagar</option>
          <option>Talabkatta</option>
          <option>Yakutpura</option>
          <option>Edi bazaar</option>
        </select>

        <div class="requirement">
          <lable><input type="checkbox" name="requirement" />Remember Me</lable>
          <a href="#">Forgot password</a>
        </div>

        <input type="submit" name="submit" />

        <div class="signup">Not a Member <a href="#">Sign Up Now</a></div>
      </form>
    </div>
  </body>
</html>
