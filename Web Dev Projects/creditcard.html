<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
     margin:0;
     padding:0;
     box-sizing: border-box;
    }
    body{
      display:flex;
      justify-content:center;
      align-items: center;
      flex-direction: column;
      min-height:100vh;
      background-color:#e3f2fd;
    }

    .container{
      position:relative;
      background-image:url(images/bg.png);
      background-size: cover;
      padding:25px;
      border-radius:28px;
      max-width:380px;
      width:100%;
      box-shadow:0 5px 10px rgba(0, 0, 0, 0.1);
      color:white;
    }

    .logo img{
      width:48px;
      margin-right:10px;
    }
    header .chip{
      width:60px;
    }
    header .logo{
      display:flex;
      align-items: center;
    }
    
    h5{
      color:#fff;
      font-size:16px;
      font-weight:400;
    }
    .container .card-details{
      display:flex;
      justify-content:space-between;
      align-items: center;
    }

    h5.number{
      font-size:18px;
      letter-spacing: 1px;
      margin-top:4px;
    }

    h5.name{
      margin-top: 20px;
    }
    </style>

</head>
<body>
  <div class="container">
    <header>
      <span class="logo">
        <img src="images/logo.png">
        <h5>Master Card</h5>
      </span>
      <img src="images/chip.png" class="chip">
    </header>
     <div class="card-details">
      <div class="name-number">
        <h6>card number</h6>
        <h5 class="number">9087 7890 6785 6789</h5>
        <h5 class="name">Daraksha Muskaan</h5>
      </div>
      <div class="valid-date">
        <h6>Valid thru</h6>
        <h5>05/28</h5>
      </div>
     </div>
  </div>
</body>
</html>
