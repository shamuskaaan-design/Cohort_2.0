<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
  <title>Reel Clone</title>
</head>
<body>
  <main>
    <section>
      <div class="all-reels">
        
        <div class="reel">
          <video autoplay loop muted id="myvideo" src ="./reels/reel01.mp4"></video>
          <i id="like" class="ri-poker-hearts-fill"></i>
          <div class="bottom">
            <div class="user">
              <img src="https://plus.unsplash.com/premium_photo-1690407617542-2f210cf20d7e?q=80&w=2187&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="image2">
              <h4>Johni Elen</h4>
              <button>Follow</button>
            </div>
            <h3>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, eos.</h3>
          </div>
          <div class="right">
            <div class="like">
              <h3 id="love-icon"><i class="ri-heart-line"></i></h3>
              <h6>500</h6>
            </div>
            <div class="comment">
              <h3 id="comment-icon"><i class="ri-chat-3-line"></i></h3>
              <h6>200</h6>
            </div>
            <div class="share">
              <h3 id="share-icon"><i class="ri-send-ins-line"></i></h3>
              <h6>88</h6>
            </div>
            <div class="more">
              <h3 id="more-icon"><i class="ri-more-2-fill"></i></h3>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
